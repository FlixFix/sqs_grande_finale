name: CI-Pipeline

on:
  push:

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven Build (without tests)
        working-directory: ./playwright_2/backend
        run: mvn clean package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            playwright_2/backend/target/*.jar

  run-mockito-tests:
    name: Run mockito tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Run mockito test
        working-directory: ./playwright_2/backend
        run: mvn test -Dtest=MockitoLibraryTest

  run-db-tests:
    name: Run tests with self started database
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Start CI docker containers
        run: docker compose -f "./playwright_2/backend/docker-compose.yaml" up -d --build --wait --wait-timeout 30

      - name: Run integration test with docker environment
        working-directory: ./playwright_2/backend
        run: mvn test -Dtest=ManualLibraryTest

  run-container-tests:
    name: Integrationstest mit Testcontainers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Run Spring Boot test with testcontainers
        working-directory: ./playwright_2/backend
        run: mvn test -Dtest=TestContainersLibraryTest

  run-playwright-tests:
    name: Run Playwright UI Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build backend (skip tests)
        working-directory: ./playwright_2/backend
        run: mvn clean package -DskipTests

      - name: Start CI docker containers
        run: docker compose -f "./playwright_2/backend/docker-compose.yaml" up -d --build --wait --wait-timeout 30

      - name: Start backend JAR
        run: java -jar ./playwright_2/backend/target/backend-0.0.1-SNAPSHOT.jar &

      - name: Install frontend dependencies
        working-directory: ./playwright_2/frontend
        run: npm install

      - name: Build frontend
        working-directory: ./playwright_2/frontend
        run: npm run build

      - name: Serve production frontend
        working-directory: ./playwright_2/frontend
        run: npx serve dist --listen 5173 &

      - name: Install Playwright and wait-on
        working-directory: ./playwright_2/testing
        run: |
          npm install
          npx playwright install --with-deps
          npm install wait-on

      - name: Wait for frontend to become available
        working-directory: ./playwright_2/testing
        run: npx wait-on http://localhost:5173

      - name: Run Playwright tests
        working-directory: ./playwright_2/testing
        run: npx playwright test --reporter=html

      - name: Upload Playwright test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright_2/testing/playwright-report/
